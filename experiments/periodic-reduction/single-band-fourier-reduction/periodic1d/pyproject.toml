[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksdft2effmass-experiment-single-band-fourier-reduction"
version = "0.1.0.dev0"
description = "Publication-independent single-band Fourier-reduction experiment."
requires-python = ">=3.14"
dependencies = [
    "ksdft2effmass",
    "numpy>=1.26",
    "scipy>=1.12",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["single_band_fourier_reduction*"]

[tool.uv.sources]
ksdft2effmass = { path = "../../../../python", editable = true }
projectkoios-optimization = { git = "https://github.com/eragasa/projectkoios-optimization.git", rev = "d38e00ceef7f0fb1c137d5c3450d210c1ae4c99f" }
projectkoios-physkit = { git = "https://github.com/eragasa/projectkoios-physkit.git", rev = "7157dcedd0d220673d443c1c025e35a6fd1ffa7a" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src", "../../../../python/src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
markers = [
    "software_verification: implementation satisfies documented software contract",
    "numerical_verification: numerical algorithm implements stated mathematics",
]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
mypy_path = "../../../../python/src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
