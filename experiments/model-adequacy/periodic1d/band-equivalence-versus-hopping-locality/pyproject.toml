[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksdft2effmass-experiment-band-equivalence-versus-hopping-locality"
version = "0.1.0.dev0"
description = "Band equivalence versus hopping locality experiment."
requires-python = ">=3.14"
dependencies = [
    "ksdft2effmass",
    "numpy>=2.3,<3",
    "projectkoios-optimization[numpy,scipy]==0.1.0.dev0",
    "projectkoios-physkit==0.1.3.dev0",
    "scipy>=1.18,<2",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["band_equivalence_hopping_locality*"]

[tool.uv.sources]
ksdft2effmass = { path = "../../../../python", editable = true }
projectkoios-optimization = { git = "https://github.com/eragasa/projectkoios-optimization.git", rev = "d38e00ceef7f0fb1c137d5c3450d210c1ae4c99f" }
projectkoios-physkit = { git = "https://github.com/eragasa/projectkoios-physkit.git", rev = "7157dcedd0d220673d443c1c025e35a6fd1ffa7a" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
markers = [
    "software_verification: implementation satisfies documented software contract",
]

[tool.mypy]
python_version = "3.14"
files = ["analysis", "src", "tests"]
mypy_path = ["src", "../../../../python/src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
target-version = "py314"
line-length = 88
src = [".", "src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
